name: Backend CI/CD (Dev)

on:
  push:
    branches: [dev]

concurrency:
  group: backend-dev-deploy
  cancel-in-progress: false

jobs:
  # ── Job 1: Build & Type Check ───────────────────────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      # NOTE: no `npm run build` here — the Docker stage compiles TypeScript once
      # (and fails on any error). This job is a fast type-check gate only.

  # ── Job 2: Docker Build & Push ──────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # QEMU removed: the runner is linux/amd64 and we build linux/amd64 only, so no
      # cross-arch emulation is needed. Emulating native modules (sharp) would be slow.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/dilse-backend
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to EC2 ────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2 (Dev)
    runs-on: ubuntu-latest
    needs: docker
    environment: development

    steps:
      # ── SES credentials ─────────────────────────────────────────────────────
      #
      # The container's environment comes from a file on the box, not from this
      # workflow — nothing else here is passed through, which is why every other
      # app secret (Mongo, JWT, S3, Resend, OpenAI, Razorpay) lives there and
      # not in GitHub. Adding SES by hand over SSH is the normal way to do it.
      #
      # This step exists because it has to be repeatable: the box can be
      # replaced, and a missing SES key does not break the API, it just silently
      # disables the draft follow-up emails with a banner nobody may notice for
      # weeks. So the keys are held as repository secrets and upserted here.
      #
      # It only ever removes and rewrites its own two lines. It never truncates
      # the file, and it skips entirely when the secrets are unset, so a fork or
      # a repo without them deploys exactly as before.
      - name: Ensure SES credentials on the box
        uses: appleboy/ssh-action@v1.0.3
        env:
          SES_ACCESS_KEY_ID: ${{ secrets.SES_ACCESS_KEY_ID }}
          SES_SECRET_ACCESS_KEY: ${{ secrets.SES_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          envs: SES_ACCESS_KEY_ID,SES_SECRET_ACCESS_KEY
          script: |
            set -eu

            if [ -z "${SES_ACCESS_KEY_ID:-}" ] || [ -z "${SES_SECRET_ACCESS_KEY:-}" ]; then
              echo "SES secrets are not set in this repository — skipping."
              exit 0
            fi

            # Which file feeds the backend container? Ask deploy.sh rather than
            # guessing, and prefer a dev-specific one when the script names more
            # than one, so a dev deploy cannot write into the production env.
            FOUND=""
            CANDS=$(grep -hoE 'env-file[= ]+[^ \\]+' /opt/dilse/scripts/deploy.sh 2>/dev/null \
                    | sed -E 's/env-file[= ]+//' | sort -u || true)
            echo "candidates named by deploy.sh: ${CANDS:-none}"

            for c in $CANDS; do
              case "$c" in
                /*dev*) [ -f "$c" ] && FOUND="$c" && break ;;
              esac
            done
            if [ -z "$FOUND" ]; then
              for c in $CANDS; do
                case "$c" in /*) [ -f "$c" ] && FOUND="$c" && break ;; esac
              done
            fi
            if [ -z "$FOUND" ]; then
              for c in /opt/dilse/dev/.env /opt/dilse/.env.dev /opt/dilse/backend.dev.env \
                       /opt/dilse/.env /opt/dilse/backend.env; do
                [ -f "$c" ] && FOUND="$c" && break
              done
            fi

            if [ -z "$FOUND" ]; then
              echo "::error::Could not locate the backend env file. Contents of /opt/dilse:"
              ls -la /opt/dilse || true
              exit 1
            fi

            # Sanity: it must look like the app's env, or we are editing the
            # wrong file. Names only — no values are printed.
            if ! grep -qE '^(PROD_MONGODB_URI|LOCAL_MONGODB_URI|JWT_SECRET)=' "$FOUND"; then
              echo "::error::$FOUND does not look like the backend env file. Keys present:"
              grep -oE '^[A-Z_]+=' "$FOUND" | sort -u || true
              exit 1
            fi
            echo "env file: $FOUND"

            SUDO=""
            [ -w "$FOUND" ] || SUDO="sudo"

            $SUDO sed -i '/^SES_ACCESS_KEY_ID=/d; /^SES_SECRET_ACCESS_KEY=/d' "$FOUND"
            printf 'SES_ACCESS_KEY_ID=%s\nSES_SECRET_ACCESS_KEY=%s\n' \
              "$SES_ACCESS_KEY_ID" "$SES_SECRET_ACCESS_KEY" | $SUDO tee -a "$FOUND" >/dev/null

            echo "SES lines now present: $(grep -c '^SES_' "$FOUND")"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 180s
          script: |
            /opt/dilse/scripts/deploy.sh backend \
              ${{ secrets.DOCKER_HUB_USERNAME }}/dilse-backend \
              dev-sha-$(echo "${{ github.sha }}" | cut -c1-7) \
              dev
