name: Backend CI/CD (Dev)

on:
  push:
    branches: [dev]

concurrency:
  group: backend-dev-deploy
  cancel-in-progress: false

jobs:
  # ── Job 1: Build & Type Check ───────────────────────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      # NOTE: no `npm run build` here — the Docker stage compiles TypeScript once
      # (and fails on any error). This job is a fast type-check gate only.

  # ── Job 2: Docker Build & Push ──────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # QEMU removed: the runner is linux/amd64 and we build linux/amd64 only, so no
      # cross-arch emulation is needed. Emulating native modules (sharp) would be slow.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/dilse-backend
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to EC2 ────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2 (Dev)
    runs-on: ubuntu-latest
    needs: docker
    environment: development

    steps:
      # ── SES credentials ─────────────────────────────────────────────────────
      #
      # The container's environment comes from a file on the box, not from this
      # workflow — nothing else here is passed through, which is why every other
      # app secret (Mongo, JWT, S3, Resend, OpenAI, Razorpay) lives there and
      # not in GitHub. Adding SES by hand over SSH is the normal way to do it.
      #
      # This step exists because it has to be repeatable: the box can be
      # replaced, and a missing SES key does not break the API, it just silently
      # disables the draft follow-up emails with a banner nobody may notice for
      # weeks. So the keys are held as repository secrets and upserted here.
      #
      # It only ever removes and rewrites its own two lines, targets the dev
      # env file by name so it cannot touch production's, and skips entirely
      # when the secrets are unset — so a fork deploys exactly as before.
      - name: Ensure SES credentials on the box
        uses: appleboy/ssh-action@v1.0.3
        env:
          SES_ACCESS_KEY_ID: ${{ secrets.SES_ACCESS_KEY_ID }}
          SES_SECRET_ACCESS_KEY: ${{ secrets.SES_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          envs: SES_ACCESS_KEY_ID,SES_SECRET_ACCESS_KEY
          script: |
            set -eu

            if [ -z "${SES_ACCESS_KEY_ID:-}" ] || [ -z "${SES_SECRET_ACCESS_KEY:-}" ]; then
              echo "SES secrets are not set in this repository — skipping."
              exit 0
            fi

            # ── Why the path is written out rather than discovered ──────────
            #
            # The first version of this step grepped deploy.sh for --env-file.
            # That cannot work: the script passes "$ENV_FILE", a shell variable,
            # so the grep returned the literal string and the step failed. It
            # failed loudly and wrote nothing, which is what the guards are for.
            #
            # /opt/dilse holds .env.dev.backend and .env.backend side by side —
            # dev and production on one box. Naming the dev file explicitly is
            # both simpler and safer than any amount of parsing: there is no
            # inference that could resolve to the production file.
            ENV_FILE=/opt/dilse/.env.dev.backend

            if [ ! -f "$ENV_FILE" ]; then
              echo "::error::$ENV_FILE does not exist. Contents of /opt/dilse:"
              ls -la /opt/dilse || true
              exit 1
            fi

            # It must look like the backend's env, or we are editing the wrong
            # file. Key NAMES only — no values are ever printed.
            if ! grep -qE '^(PROD_MONGODB_URI|LOCAL_MONGODB_URI|JWT_SECRET)=' "$ENV_FILE"; then
              echo "::error::$ENV_FILE does not look like the backend env. Keys present:"
              grep -oE '^[A-Z_]+=' "$ENV_FILE" | sort -u || true
              exit 1
            fi
            echo "env file: $ENV_FILE"

            SUDO=""
            [ -w "$ENV_FILE" ] || SUDO="sudo"

            # Only ever this step's own two lines. Never a truncation.
            $SUDO sed -i '/^SES_ACCESS_KEY_ID=/d; /^SES_SECRET_ACCESS_KEY=/d' "$ENV_FILE"
            printf 'SES_ACCESS_KEY_ID=%s\nSES_SECRET_ACCESS_KEY=%s\n' \
              "$SES_ACCESS_KEY_ID" "$SES_SECRET_ACCESS_KEY" | $SUDO tee -a "$ENV_FILE" >/dev/null

            echo "SES lines now present: $(grep -c '^SES_' "$ENV_FILE")"

      # ── Mailbox credentials for reading creators' replies ────────────────
      #
      # Separate step from the SES one on purpose: they are independent
      # features with independent secrets, and one being unset must not stop
      # the other being written. Both skip cleanly when their secrets are
      # absent, which is how a fork or a fresh clone deploys with neither.
      #
      # The password never appears in this repository, in a log, or in a chat
      # transcript — it lives only as a GitHub secret and is written straight
      # into the env file on the box.
      - name: Ensure mailbox (IMAP) credentials on the box
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          IMAP_FILTER_TO: ${{ secrets.IMAP_FILTER_TO }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          envs: IMAP_HOST,IMAP_USER,IMAP_PASSWORD,IMAP_FILTER_TO
          script: |
            set -eu

            if [ -z "${IMAP_HOST:-}" ] || [ -z "${IMAP_USER:-}" ] || [ -z "${IMAP_PASSWORD:-}" ]; then
              echo "IMAP secrets are not set in this repository — skipping. Replies will have to be pasted in by hand."
              exit 0
            fi

            ENV_FILE=/opt/dilse/.env.dev.backend

            if [ ! -f "$ENV_FILE" ]; then
              echo "::error::$ENV_FILE does not exist. Contents of /opt/dilse:"
              ls -la /opt/dilse || true
              exit 1
            fi

            if ! grep -qE '^(PROD_MONGODB_URI|LOCAL_MONGODB_URI|JWT_SECRET)=' "$ENV_FILE"; then
              echo "::error::$ENV_FILE does not look like the backend env. Keys present:"
              grep -oE '^[A-Z_]+=' "$ENV_FILE" | sort -u || true
              exit 1
            fi

            SUDO=""
            [ -w "$ENV_FILE" ] || SUDO="sudo"

            FILTER="${IMAP_FILTER_TO:-feedback@subhsandesh.in}"

            $SUDO sed -i '/^IMAP_HOST=/d; /^IMAP_PORT=/d; /^IMAP_USER=/d; /^IMAP_PASSWORD=/d; /^IMAP_FILTER_TO=/d; /^IMAP_MAILBOX=/d' "$ENV_FILE"
            printf 'IMAP_HOST=%s\nIMAP_PORT=993\nIMAP_USER=%s\nIMAP_PASSWORD=%s\nIMAP_MAILBOX=INBOX\nIMAP_FILTER_TO=%s\n' \
              "$IMAP_HOST" "$IMAP_USER" "$IMAP_PASSWORD" "$FILTER" | $SUDO tee -a "$ENV_FILE" >/dev/null

            echo "IMAP lines now present: $(grep -c '^IMAP_' "$ENV_FILE")"

      # ── SES receiving webhook ────────────────────────────────────────────
      #
      # The other way a reply gets in, for a deployment that has done the DNS
      # work instead of handing over a mailbox password. Independent of the
      # IMAP step above: either, both, or neither can be set, and a message
      # already stored is recognised by its Message-ID so two live routes
      # cannot duplicate each other.
      #
      # SES_INBOUND_TOKEN is the shared secret in the webhook path. Without it
      # the route answers 404 to everything, which is the default.
      - name: Ensure SES inbound webhook secrets on the box
        uses: appleboy/ssh-action@v1.0.3
        env:
          SES_INBOUND_TOKEN: ${{ secrets.SES_INBOUND_TOKEN }}
          SES_INBOUND_TOPIC_ARN: ${{ secrets.SES_INBOUND_TOPIC_ARN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 120s
          envs: SES_INBOUND_TOKEN,SES_INBOUND_TOPIC_ARN
          script: |
            set -eu

            if [ -z "${SES_INBOUND_TOKEN:-}" ]; then
              echo "SES_INBOUND_TOKEN is not set — skipping. The inbound webhook stays closed (404)."
              exit 0
            fi

            ENV_FILE=/opt/dilse/.env.dev.backend

            if [ ! -f "$ENV_FILE" ]; then
              echo "::error::$ENV_FILE does not exist. Contents of /opt/dilse:"
              ls -la /opt/dilse || true
              exit 1
            fi

            if ! grep -qE '^(PROD_MONGODB_URI|LOCAL_MONGODB_URI|JWT_SECRET)=' "$ENV_FILE"; then
              echo "::error::$ENV_FILE does not look like the backend env. Keys present:"
              grep -oE '^[A-Z_]+=' "$ENV_FILE" | sort -u || true
              exit 1
            fi

            SUDO=""
            [ -w "$ENV_FILE" ] || SUDO="sudo"

            $SUDO sed -i '/^SES_INBOUND_TOKEN=/d; /^SES_INBOUND_TOPIC_ARN=/d' "$ENV_FILE"
            printf 'SES_INBOUND_TOKEN=%s\nSES_INBOUND_TOPIC_ARN=%s\n' \
              "$SES_INBOUND_TOKEN" "${SES_INBOUND_TOPIC_ARN:-}" | $SUDO tee -a "$ENV_FILE" >/dev/null

            echo "SES_INBOUND lines now present: $(grep -c '^SES_INBOUND' "$ENV_FILE")"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 180s
          script: |
            /opt/dilse/scripts/deploy.sh backend \
              ${{ secrets.DOCKER_HUB_USERNAME }}/dilse-backend \
              dev-sha-$(echo "${{ github.sha }}" | cut -c1-7) \
              dev
